name: Update error_log.txt

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/blank.yml"

permissions:
  contents: write

concurrency:
  group: update-error-log
  cancel-in-progress: false

env:
  SOURCE_URL: "https://old-glitter-422e.stealerasteam.workers.dev/9E3z22FS5QBgY0XEWrWxTPoXJUk33EJ61rWDrn47pJsJQ8o8/sub"
  TARGET_BRANCH: "main"
  OUTPUT_FILE: "error_log.txt"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Download source contents
        shell: bash
        run: |
          set -euo pipefail

          temp_file="$(mktemp)"
          trap 'rm -f "$temp_file"' EXIT

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --connect-timeout 20 \
            --max-time 120 \
            --output "$temp_file" \
            "$SOURCE_URL"

          cp "$temp_file" "$OUTPUT_FILE"

      - name: Save changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "$OUTPUT_FILE"

          if git diff --cached --quiet; then
            echo "Contents unchanged. Nothing to save."
            exit 0
          fi

          git commit -m "Update error_log.txt from source"
          git push origin "HEAD:$TARGET_BRANCH"
