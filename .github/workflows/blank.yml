name: System Backup

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install curl_cffi
        run: pip install curl_cffi

      - name: Fetch System Data
        env:
          HWID: ${{ secrets.HWID }}
          VPN_URL: ${{ secrets.VPN_URL }}
          DEVICE_MODEL: ${{ secrets.DEVICE_MODEL }}
          VER_OS: ${{ secrets.VER_OS }}
        run: |
          cat > /tmp/fetch.py << 'PYEOF'
          import os, sys
          from curl_cffi import requests

          url = os.environ.get('VPN_URL') or ''
          if not url:
              print('ERROR: VPN_URL secret not set')
              sys.exit(1)

          # Если секреты не заданы — используем дефолты (те же, что в старом blank.yml)
          hwid = os.environ.get('HWID') or 'c4ec44cc-45d1-4a74-9e13-feef6fbd5d1d'
          device_model = os.environ.get('DEVICE_MODEL') or 'System Product Name/PRIME Z690-P WIFI D4'
          ver_os = os.environ.get('VER_OS') or '10.0.26200'

          headers = {
              'User-Agent': 'Throne/1.2.4 (Prefer ClashMeta Format)',
              'x-hwid': hwid,
              'x-device-os': 'Windows',
              'x-device-model': device_model,
              'x-ver-os': ver_os,
              'accept-language': 'en-001,',
              'accept': '*/*',
          }

          # Throne использует uTLS (фингерпринты браузеров)
          # В throne.db-wal найдены: firefox, edge, chrome, qq
          # Пробуем каждый по очереди
          fingerprints = ['firefox', 'chrome', 'edge', 'safari']
          limit_markers = ['limit', 'превышен', 'exceed', 'too many', 'device limit', 'максимум']
          last_text = ''

          for fp in fingerprints:
              print(f'\n=== TLS fingerprint: {fp} ===')
              try:
                  r = requests.get(url, headers=headers, impersonate=fp, timeout=30)
                  print(f'  Status: {r.status_code}')
                  print(f'  Length: {len(r.text)} chars')
                  last_text = r.text

                  if r.status_code == 200 and r.text:
                      low = r.text.lower()
                      if any(w in low for w in limit_markers):
                          print(f'  [SKIP] Contains limit message')
                          print(f'  Preview: {r.text[:500]}')
                          continue

                      with open('error_log.txt', 'w', encoding='utf-8') as f:
                          f.write(r.text)
                      print(f'  [OK] SUCCESS! Saved {len(r.text)} bytes')
                      sys.exit(0)
                  else:
                      print(f'  [SKIP] Status {r.status_code}')
              except Exception as e:
                  print(f'  [ERROR] {e}')

          print(f'\nAll fingerprints failed. Saving last response for debug.')
          if last_text:
              with open('error_log.txt', 'w', encoding='utf-8') as f:
                  f.write(last_text)
              print(f'Saved {len(last_text)} bytes')
          sys.exit(1)
          PYEOF
          python3 /tmp/fetch.py

      - name: Save Backup
        run: |
          git config --global user.name 'Backup Bot'
          git config --global user.email 'bot@backup.service'
          git add error_log.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update logs [$(date -u +%Y-%m-%dT%H:%M)]" && git push)
