name: System Backup

on:
  schedule:
    - cron: '0 */3 * * *' # каждые 3 часа
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Fetch System Data
        run: |
          curl -L -v \
          -A "mihomo/1.18.0" \
          -H "x-hwid: c4ec44cc-45d1-4a74-9e13-feef6fbd5d1d" \
          -H "x-device-os: Android" \
          -H "x-device-model: Pixel 9 XL" \
          -H "x-ver-os: 17" \
          -H "accept-language: en-001,*" \
          -o error_log.txt \
          "${{ secrets.VPN_URL }}"

          if [ ! -s error_log.txt ]; then
             echo "Ошибка загрузки!"
             exit 1
          fi

      - name: Save Backup
        run: |
          git config --global user.name 'Backup Bot'
          git config --global user.email 'bot@backup.service'
          git add error_log.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update logs" && git push)
